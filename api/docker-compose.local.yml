version: "3.8"

services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:4.9.2
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=${DEBUG:-1}
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:3000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./scripts/localstack:/etc/localstack/init/ready.d

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "password"]

  dev_postgres:
    image: postgres:16
    container_name: project_dev_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project_dev_db
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test_postgres:
    image: postgres:16
    container_name: project_test_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project_test_db
    ports:
      - "5443:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  stripe-cli:
    network_mode: "host"
    image: stripe/stripe-cli:v1.42.0
    command: listen --api-key=$STRIPE_SECRET_KEY --forward-to ${STRIPE_WEBHOOK_FORWARD_URL:-http://localhost:${BE_PORT:-3000}/api/v1/payments/webhook} --latest

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  postgres_test_data:
